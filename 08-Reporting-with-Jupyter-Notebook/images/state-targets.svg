<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Title -->
  <text x="400" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Sales Targets by State: Q1 vs Q2 2025</text>
  
  <!-- Legend -->
  <rect x="290" y="70" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="315" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563">2025 Q1 Target</text>
  <rect x="430" y="70" width="16" height="16" rx="3" fill="#10b981"/>
  <text x="455" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4b5563">2025 Q2 Target</text>

  <!-- Y Axis Grid -->
  <g stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1">
    <line x1="100" y1="380" x2="720" y2="380"/>
    <line x1="100" y1="320" x2="720" y2="320"/>
    <line x1="100" y1="260" x2="720" y2="260"/>
    <line x1="100" y1="200" x2="720" y2="200"/>
    <line x1="100" y1="140" x2="720" y2="140"/>
  </g>

  <!-- Y Axis Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">
    <text x="85" y="385">0</text>
    <text x="85" y="325">1,500</text>
    <text x="85" y="265">3,000</text>
    <text x="85" y="205">4,500</text>
    <text x="85" y="145">6,000</text>
  </g>

  <!-- State Bars: NSW (5050, 5550), VIC (4950, 5450), QLD (4800, 5300), WA (4800, 5300) -->
  <!-- Scale: 6000 = 240px, so 1 unit = 0.04px. Bar height = target * 0.04. Baseline = 380 -->
  <!-- NSW: Q1 5050 -> 202px (y=178), Q2 5550 -> 222px (y=158) -->
  <g>
    <rect x="145" y="178" width="45" height="202" rx="4" fill="#3b82f6"/>
    <text x="167" y="170" font-family="sans-serif" font-size="11" fill="#1e40af" font-weight="600" text-anchor="middle">5,050</text>
    <rect x="195" y="158" width="45" height="222" rx="4" fill="#10b981"/>
    <text x="217" y="150" font-family="sans-serif" font-size="11" fill="#065f46" font-weight="600" text-anchor="middle">5,550</text>
    <text x="192" y="405" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">NSW</text>
  </g>

  <!-- VIC: Q1 4950 -> 198px (y=182), Q2 5450 -> 218px (y=162) -->
  <g>
    <rect x="295" y="182" width="45" height="198" rx="4" fill="#3b82f6"/>
    <text x="317" y="174" font-family="sans-serif" font-size="11" fill="#1e40af" font-weight="600" text-anchor="middle">4,950</text>
    <rect x="345" y="162" width="45" height="218" rx="4" fill="#10b981"/>
    <text x="367" y="154" font-family="sans-serif" font-size="11" fill="#065f46" font-weight="600" text-anchor="middle">5,450</text>
    <text x="342" y="405" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">VIC</text>
  </g>

  <!-- QLD: Q1 4800 -> 192px (y=188), Q2 5300 -> 212px (y=168) -->
  <g>
    <rect x="445" y="188" width="45" height="192" rx="4" fill="#3b82f6"/>
    <text x="467" y="180" font-family="sans-serif" font-size="11" fill="#1e40af" font-weight="600" text-anchor="middle">4,800</text>
    <rect x="495" y="168" width="45" height="212" rx="4" fill="#10b981"/>
    <text x="517" y="160" font-family="sans-serif" font-size="11" fill="#065f46" font-weight="600" text-anchor="middle">5,300</text>
    <text x="492" y="405" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">QLD</text>
  </g>

  <!-- WA: Q1 4800 -> 192px (y=188), Q2 5300 -> 212px (y=168) -->
  <g>
    <rect x="595" y="188" width="45" height="192" rx="4" fill="#3b82f6"/>
    <text x="617" y="180" font-family="sans-serif" font-size="11" fill="#1e40af" font-weight="600" text-anchor="middle">4,800</text>
    <rect x="645" y="168" width="45" height="212" rx="4" fill="#10b981"/>
    <text x="667" y="160" font-family="sans-serif" font-size="11" fill="#065f46" font-weight="600" text-anchor="middle">5,300</text>
    <text x="642" y="405" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">WA</text>
  </g>

  <!-- Axes lines -->
  <line x1="100" y1="380" x2="720" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
</svg>